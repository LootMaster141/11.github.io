<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资源库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-image: url('files/bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: -1;
        }
        .box {
            max-width: 400px;
            padding: 30px;
            background: rgba(34,34,34,0.9);
            border-radius: 12px;
            backdrop-filter: blur(8px);
        }
        h2 { margin-bottom: 20px; font-size: 22px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #0052cc; }
        .content { display: none; margin-top: 30px; }
        .download {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #00c853;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="overlay"></div>

<div class="box" id="loginBox">
    <h2>请输入访问密码</h2>
    <input type="password" id="pwd" placeholder="输入密码">
    <br><br>
    <button onclick="checkPwd()">确认登录</button>
</div>

<div class="content" id="mainContent">
    <h2>资源库</h2>
    <a href="files/全局机型模拟-一加 15.zip" class="download" download>点击下载文件</a>
</div>

<script>
// ======================================
// 🔴 你以后只改这里的密码，改完立刻生效！
const RIGHT_PWD = "111";
// ======================================

// 强制清空所有旧登录（关键！）
localStorage.clear();
sessionStorage.clear();
document.cookie = "auth=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";

function checkPwd() {
    let input = document.getElementById("pwd").value;
    if (input === RIGHT_PWD) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
    } else {
        alert("密码错误");
    }
}
</script>
</body>
</html>
