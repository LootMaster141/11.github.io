<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资源库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* 背景图路径：指向 files 文件夹里的 bg.png */
            background-image: url('files/bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        /* 半透明模糊背景，保证文字清晰 */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: -1;
        }
        .box {
            max-width: 400px;
            padding: 30px;
            background: rgba(34,34,34,0.9);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { margin-bottom: 20px; font-size: 22px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #0052cc; }
        .content { display: none; margin-top: 30px; }
        .download {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #00c853;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }
        .download:hover { background: #00b248; }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="box" id="loginBox">
        <h2>请输入访问密码</h2>
        <input type="password" id="pwd" placeholder="输入密码">
        <br><br>
        <button onclick="checkPwd()">确认登录</button>
    </div>

    <div class="box content" id="mainContent">
        <h2>资源库</h2>
        <!-- 下载链接：对应你重命名后的压缩包 -->
        <a href="files/global_model_sim_redmagic_pad3pro.zip" class="download" download>
            点击下载 红魔Pad3Pro 机型模拟
        </a>
    </div>

    <script>
        // 🔒 密码设置区
        const RIGHT_PWD = "1887415157yy";
        
        // 强制清除旧登录状态，改密码必生效
        localStorage.removeItem("auth_ok");

        function checkPwd() {
            let input = document.getElementById("pwd").value.trim();
            if (input === RIGHT_PWD) {
                localStorage.setItem("auth_ok", "true");
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
            } else {
                alert("密码错误，请重试！");
                document.getElementById("pwd").value = ""; // 清空输入框
            }
        }

        // 页面加载验证
        window.onload = function() {
            if (localStorage.getItem("auth_ok") === "true") {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
            }
        }
    </script>
</body>
</html>
