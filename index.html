<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资源库</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-image: url('files/bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.45);
            z-index: -1;
        }

        .login-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            padding: 32px;
            background: rgba(30,30,30,0.65);
            border-radius: 20px;
            backdrop-filter: blur(22px) saturate(1.8);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeInScale 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .login-box h2 {
            margin-bottom: 24px;
            font-size: 22px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            transition: 0.25s ease;
        }
        input:focus {
            outline: none;
            border-color: rgba(0,102,255,0.5);
            background: rgba(255,255,255,0.15);
            transform: scale(1.02);
        }
        input::placeholder { color: #ccc; }
        button {
            padding: 16px 30px;
            background: linear-gradient(135deg, #0071FF, #005ED0);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            transition: 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
            box-shadow: 0 6px 18px rgba(0,113,255,0.3);
        }
        button:active { transform: scale(0.97); }

        .app-list {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            padding: 20px;
            display: none;
            overflow: hidden;
        }
        .pull-refresh {
            width: 100%; height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            transform: translateZ(0);
            will-change: transform;
        }

        .refresh-tip {
            display: none !important;
        }

        .app-item {
            background: rgba(28,28,28,0.5);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
            transform: translateZ(0);
        }
        .app-item:active {
            background: rgba(40,40,40,0.6);
            transform: scale(0.985);
        }
        .app-name {
            font-size: 16px;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .download-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #00E470, #00C864);
            color: #fff;
            border-radius: 14px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.25s ease;
        }
        .download-btn:active { transform: scale(0.96); }

        .app-item {
            opacity: 0;
            transform: translateY(24px);
            animation: slideUp 0.4s cubic-bezier(0.2,0.8,0.2,1) forwards;
        }
        @keyframes slideUp {
            to { opacity:1; transform:translateY(0); }
        }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="login-box" id="loginBox">
    <h2>请输入访问密码</h2>
    <input type="password" id="pwd" placeholder="输入密码">
    <button onclick="checkPwd()">确认登录</button>
</div>

<div class="app-list" id="appList">
    <div class="pull-refresh" id="pullRefresh">
        <div class="refresh-tip" id="refreshTip"></div>
        <div id="appListContent"></div>
    </div>
</div>

<script>
    // ============================
    // 🔐 配置区（修改密码时，必须同时修改版本号！）
    // ============================
    const RIGHT_PWD = "111";       // 你的密码
    const VERSION = 2;            // 每次改密码，把数字+1（比如从2改成3）
    // ============================

    const appList = [
        { name: "红魔Pad3Pro 机型模拟", path: "files/global_model_sim_redmagic_pad3pro.zip" },
        { name: "7436", path: "files/LSPosed-v1.9.2-it-7436-release.zip" },
        { name: "zy", path: "files/Zygisk-Next-1.3.1-665-7e5b533-release.zip" },
        { name: "淋羽", path: "files/林羽江颜过电报验证.sh" },
        { name: "核心破解", path: "files/核心破解_4.8.apk" },
        { name: "1+15", path: "files/全局机型模拟-一加15.zip" }
    ];

    const loginBox = document.getElementById("loginBox");
    const appListEl = document.getElementById("appList");
    const appListContent = document.getElementById("appListContent");
    let startY = 0;

    // 强制踢人核心逻辑：检查版本号
    function checkVersion() {
        const localVersion = localStorage.getItem('version');
        // 如果版本号不匹配，直接登出
        if (localVersion != VERSION) {
            logout();
            return false;
        }
        return true;
    }

    // 登出函数
    function logout() {
        localStorage.clear();
        appListEl.style.display = "none";
        loginBox.style.display = "block";
        loginBox.style.animation = "fadeInScale 0.4s forwards";
        document.getElementById("pwd").value = "";
    }

    function checkPwd() {
        const inputPwd = document.getElementById("pwd").value.trim();
        if (inputPwd === RIGHT_PWD) {
            // 登录成功，记录当前版本号
            localStorage.setItem('version', VERSION);
            
            loginBox.style.animation = "fadeOutScale 0.3s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards";
            setTimeout(() => {
                loginBox.style.display = "none";
                appListEl.style.display = "block";
                renderAppList();
            }, 300);
        } else {
            alert("密码错误，请重试！");
            document.getElementById("pwd").value = "";
            loginBox.style.animation = "shake 0.4s cubic-bezier(.36,.07,.19,.97) both";
            setTimeout(() => {
                loginBox.style.animation = "";
            }, 400);
        }
    }

    // 动画样式
    const style = document.createElement('style');
    style.textContent = `
        @keyframes shake {
            10%, 90% { transform: translate(-50%, -50%) translateX(-1px); }
            20%, 80% { transform: translate(-50%, -50%) translateX(2px); }
            30%, 50%, 70% { transform: translate(-50%, -50%) translateX(-3px); }
            40%, 60% { transform: translate(-50%, -50%) translateX(3px); }
        }
        @keyframes fadeOutScale {
            from { opacity:1; transform: translate(-50%, -50%) scale(1); }
            to { opacity:0; transform: translate(-50%, -50%) scale(0.9); }
        }
    `;
    document.head.appendChild(style);

    function renderAppList() {
        // 渲染前先检查版本，防止部署后用户还在浏览
        if (!checkVersion()) return;

        let listHtml = "";
        appList.forEach((item, index) => {
            listHtml += `
            <div class="app-item" style="animation-delay: ${index * 0.05}s">
                <span class="app-name">${item.name}</span>
                <a href="${item.path}" class="download-btn" download>下载</a>
            </div>`;
        });
        appListContent.innerHTML = listHtml;
    }

    // 下拉刷新时也检查版本
    document.getElementById("pullRefresh").addEventListener("touchstart", (e) => {
        startY = e.touches[0].clientY;
    }, { passive: true });

    document.getElementById("pullRefresh").addEventListener("touchend", (e) => {
        const endY = e.changedTouches[0].clientY;
        if (endY - startY > 60) {
            // 下拉刷新先检查版本
            if (checkVersion()) {
                setTimeout(() => {
                    renderAppList();
                }, 600);
            }
        }
    }, { passive: true });

    // 页面加载时自动检查版本
    window.onload = function() {
        if (appListEl.style.display === "block") {
            checkVersion();
        }
    };
</script>
</body>
</html>
