<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资源库</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-image: url('files/bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: -1;
        }
        .login-box {
            max-width: 400px;
            padding: 30px;
            background: rgba(34,34,34,0.9);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            text-align: center;
        }
        h2 { margin-bottom: 20px; font-size: 22px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #0052cc; }

        /* 下拉刷新 + 列表样式 */
        .pull-refresh {
            position: relative;
            overflow-y: auto;
            max-height: 80vh;
            width: 100%;
            padding-top: 10px;
        }
        .refresh-tip {
            position: sticky;
            top: 0;
            text-align: center;
            color: #ccc;
            padding: 8px 0;
            background: rgba(0,0,0,0.6);
            display: none;
        }
        .app-list {
            max-width: 600px;
            width: 100%;
            padding: 20px;
            display: none;
        }
        .app-item {
            background: rgba(34,34,34,0.9);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-name { font-size: 16px; font-weight: 500; }
        .download-btn {
            padding: 8px 14px;
            background: #00c853;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }
        .download-btn:hover { background: #00b248; }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="login-box" id="loginBox">
        <h2>请输入访问密码</h2>
        <input type="password" id="pwd" placeholder="输入密码">
        <button onclick="checkPwd()">确认登录</button>
    </div>

    <div class="app-list" id="appList">
        <div class="pull-refresh" id="pullRefresh">
            <div class="refresh-tip" id="refreshTip">刷新中...</div>
            <div id="appListContent"></div>
        </div>
    </div>

    <script>
        // 1. 密码已固定为：111（无需修改）
        const RIGHT_PWD = "111";

        // 2. 修正后的软件列表（与你files文件夹完全匹配）
        const appList = [
            { name: "红魔Pad3Pro 机型模拟", path: "files/global_model_sim_redmagic_pad3pro.zip" },
            { name: "7436", path: "files/LSPosed-v1.9.2-it-7436-release.zip" },
            { name: "zy", path: "files/Zygisk-Next-1.3.1-665-7e5b533-release.zip" },
            { name: "淋羽", path: "files/林羽江颜过电报验证.sh" },
            { name: "核心破解", path: "files/核心破解_4.8.apk" },
            { name: "啊灵", path: "files/阿灵的设备标识重置（随机ID修改）.sh" },
            { name: "1+15", path: "files/全局机型模拟-一加15.zip" }
        ];

        // 3. 核心DOM元素获取
        const loginBox = document.getElementById("loginBox");
        const appListEl = document.getElementById("appList");
        const appListContent = document.getElementById("appListContent");
        const refreshTip = document.getElementById("refreshTip");
        let startY = 0;

        // 4. 修复登录逻辑（确保无执行中断）
        function checkPwd() {
            const inputPwd = document.getElementById("pwd").value.trim();
            if (inputPwd === RIGHT_PWD) {
                // 清除所有缓存，避免旧状态干扰
                localStorage.clear();
                sessionStorage.clear();
                // 隐藏登录框，显示列表
                loginBox.style.display = "none";
                appListEl.style.display = "block";
                // 渲染软件列表
                renderAppList();
            } else {
                alert("密码错误！请输入111");
                document.getElementById("pwd").value = ""; // 清空输入框
            }
        }

        // 5. 渲染列表（纯文本拼接，避免语法错误）
        function renderAppList() {
            let listHtml = "";
            appList.forEach(item => {
                listHtml += `
                <div class="app-item">
                    <span class="app-name">${item.name}</span>
                    <a href="${item.path}" class="download-btn" download>下载</a>
                </div>
                `;
            });
            appListContent.innerHTML = listHtml;
        }

        // 6. 下拉刷新功能（手机+PC双支持）
        // 手机端触摸刷新
        document.getElementById("pullRefresh").addEventListener("touchstart", (e) => {
            startY = e.touches[0].clientY;
        });
        document.getElementById("pullRefresh").addEventListener("touchend", (e) => {
            const endY = e.changedTouches[0].clientY;
            if (endY - startY > 60) {
                refreshTip.style.display = "block";
                setTimeout(() => {
                    renderAppList();
                    refreshTip.style.display = "none";
                }, 800);
            }
        });
        // PC端点击刷新
        refreshTip.addEventListener("click", () => {
            refreshTip.style.display = "block";
            setTimeout(() => {
                window.location.reload(true);
            }, 800);
        });
    </script>
</body>
</html>
