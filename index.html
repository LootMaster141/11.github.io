<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资源库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        .box {
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            background: #222;
            border-radius: 12px;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0052cc;
        }
        .content {
            display: none;
            margin-top: 30px;
        }
        .download {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #00c853;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="box" id="loginBox">
    <h2>请输入访问密码</h2>
    <input type="password" id="pwd" placeholder="输入密码">
    <br><br>
    <button onclick="checkPwd()">确认登录</button>
</div>

<div class="content" id="mainContent">
    <h2>资源库</h2>
    <a href="files/global_model_sim_redmagic_pad3pro.zip" class="download" download>点击下载文件</a>
</div>

<script>
// ======================================
// 这里是密码，你以后改这里就行
const RIGHT_PWD = "1887415157yy";
// ======================================

// 一打开就清除旧登录（强制重新输密码）
localStorage.removeItem("auth_ok");

function checkPwd() {
    let input = document.getElementById("pwd").value;
    if (input === RIGHT_PWD) {
        localStorage.setItem("auth_ok", "true");
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
    } else {
        alert("密码错误，请重试");
    }
}

// 页面加载检查
window.onload = function() {
    let auth = localStorage.getItem("auth_ok");
    if (auth === "true") {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
    }
}
</script>

</body>
</html>
