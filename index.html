<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的私人软件库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#f7f8fa;color:#333;padding:20px;}
.login{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;z-index:999}
.login input{padding:12px 16px;border:1px solid #ddd;border-radius:10px;width:260px}
.login button{padding:12px 24px;background:#007aff;color:#fff;border:none;border-radius:10px;width:260px}
.container{max-width:1000px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.title{font-size:22px;font-weight:700}
.share-btn{padding:8px 14px;background:#007aff;color:#fff;border:none;border-radius:8px}
.app-box{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.app{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 2px 10px #00000006}
.app img{width:60px;height:60px;border-radius:10px;object-fit:cover;margin-bottom:10px}
.app h3{font-size:15px;margin-bottom:6px}
.app p{font-size:12px;color:#999;margin-bottom:10px}
.app a{display:inline-block;padding:6px 12px;background:#007aff;color:#fff;border-radius:8px;font-size:12px;text-decoration:none}
</style>
</head>

<body>
<div class="login" id="login">
  <div class="title">请输入访问密码</div>
  <input type="password" id="pwd" placeholder="请输入密码">
  <button onclick="checkPwd()">进入软件库</button>
</div>

<div class="container" style="display:none" id="mainContent">
  <div class="header">
    <div class="title">我的私人软件库</div>
    <button class="share-btn" onclick="copyLink()">复制分享链接</button>
  </div>

  <div class="app-box" id="appList">
    <div class="app">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384089.png">
      <h3>QQ</h3>
      <p>官方最新版</p>
      <!-- 这里是下载链接，指向你上传到 GitHub 的安装包 -->
      <a href="files/QQSetup.exe" download>下载 QQ 安装包</a>
    </div>
  </div>
</div>

<script>
// ========== 已帮你设置好密码 ==========
const PASSWORD = "188";
// ====================================

function checkPwd(){
  let val = document.getElementById("pwd").value;
  if(val === PASSWORD){
    document.getElementById("login").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
    localStorage.setItem("appStorePwd", "ok");
  }else{
    alert("密码错误");
  }
}

function copyLink(){
  let link = window.location.href;
  navigator.clipboard.writeText(link).then(()=>{
    alert("已复制分享链接：" + link);
  })
}

window.onload = function(){
  if(localStorage.getItem("appStorePwd") === "ok"){
    document.getElementById("login").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
  }
}
</script>
</body>
</html>
