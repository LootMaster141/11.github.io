<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资源库</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 🔥 秒开背景：无图片，极致速度 */
        body {
            background: #101015;
            color: #fff;
        }

        .overlay {
            display: none;
        }

        .login-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            padding: 32px;
            background: rgba(30,30,40,0.8);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeInScale 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .login-box h2 {
            margin-bottom: 24px;
            font-size: 22px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            transition: 0.25s ease;
        }
        input:focus {
            outline: none;
            border-color: #0071FF;
            background: rgba(255,255,255,0.15);
            transform: scale(1.02);
        }
        input::placeholder { color: #ccc; }
        button {
            padding: 16px 30px;
            background: linear-gradient(135deg, #0071FF, #005ED0);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            transition: 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
        }
        button:active { transform: scale(0.97); }

        .app-list {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            padding: 20px;
            display: none;
            overflow: hidden;
        }
        .pull-refresh {
            width: 100%; height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .refresh-tip {
            display: none !important;
        }

        .app-item {
            background: rgba(40,40,50,0.6);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.2s;
            opacity: 1 !important;
            animation: none !important;
        }
        .app-item:active {
            background: rgba(60,60,70,0.8);
            transform: scale(0.985) !important;
        }
        .app-name {
            font-size: 16px;
            font-weight: 500;
        }
        .download-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #00E470, #00C864);
            color: #fff;
            border-radius: 14px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .download-btn.test {
            background: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="login-box" id="loginBox">
    <h2>请输入密码</h2>
    <input type="password" id="pwd" placeholder="输入密码">
    <button onclick="checkPwd()">确认登录</button>
</div>

<div class="app-list" id="appList">
    <div class="pull-refresh" id="pullRefresh">
        <div id="appListContent"></div>
    </div>
</div>

<script>
    const RIGHT_PWD = "111";
    const VERSION = 2;

    // 🔥 已替换为你最新的文件路径和名称
    const realFiles = [
        { name: "红魔Pad3Pro 机型模拟", path: "files/全局机型模拟-红魔 Pad 3 Pro.zip" },
        { name: "7436", path: "files/LSPosed-v1.9.2-it-7436-release（1）.zip" },
        { name: "zy", path: "files/Zygisk-Next-1.3.1-665-7e5b533-release（1）.zip" },
        { name: "核心破解", path: "files/核心破解_4.8.apk" },
        { name: "1+15", path: "files/全局机型模拟-一加 15.zip" }
    ];

    // 15个测试项保留，不影响使用
    const testFiles = Array.from({ length: 15 }, (_, i) => ({
        name: `测试项 ${i+1}`,
        isTest: true
    }));

    const appList = [...realFiles, ...testFiles];

    const loginBox = document.getElementById("loginBox");
    const appListEl = document.getElementById("appList");
    const appListContent = document.getElementById("appListContent");

    function checkVersion() {
        const localVersion = localStorage.getItem('version');
        if (localVersion != VERSION) { logout(); return false; }
        return true;
    }

    function logout() {
        localStorage.clear();
        appListEl.style.display = "none";
        loginBox.style.display = "block";
        document.getElementById("pwd").value = "";
    }

    function checkPwd() {
        const inputPwd = document.getElementById("pwd").value.trim();
        if (inputPwd === RIGHT_PWD) {
            localStorage.setItem('version', VERSION);
            loginBox.style.animation = "fadeOutScale 0.3s forwards";
            setTimeout(() => {
                loginBox.style.display = "none";
                appListEl.style.display = "block";
                renderAppList();
            }, 300);
        } else {
            alert("密码错误，请重试！");
            document.getElementById("pwd").value = "";
        }
    }

    // 补全动画样式，避免登录动画报错
    const style = document.createElement('style');
    style.textContent = `
        @keyframes fadeOutScale {
            from { opacity:1; transform: translate(-50%, -50%) scale(1); }
            to { opacity:0; transform: translate(-50%, -50%) scale(0.9); }
        }
    `;
    document.head.appendChild(style);

    function renderAppList() {
        if (!checkVersion()) return;
        let listHtml = "";
        appList.forEach(item => {
            if (item.isTest) {
                listHtml += `
                <div class="app-item">
                    <span class="app-name">${item.name}</span>
                    <a class="download-btn test" onclick="alert('测试模式，无法下载')">下载</a>
                </div>`;
            } else {
                listHtml += `
                <div class="app-item">
                    <span class="app-name">${item.name}</span>
                    <a class="download-btn" href="${item.path}" download>下载</a>
                </div>`;
            }
        });
        appListContent.innerHTML = listHtml;
    }

    // 下拉刷新功能保留，版本验证不丢
    let startY = 0;
    document.getElementById("pullRefresh").addEventListener("touchstart", (e) => {
        startY = e.touches[0].clientY;
    }, { passive: true });

    document.getElementById("pullRefresh").addEventListener("touchend", (e) => {
        const endY = e.changedTouches[0].clientY;
        if (endY - startY > 60) {
            if (checkVersion()) {
                setTimeout(() => {
                    renderAppList();
                }, 600);
            }
        }
    }, { passive: true });

    window.onload = () => {
        if (appListEl.style.display === "block") checkVersion();
    };
</script>
</body>
</html>
