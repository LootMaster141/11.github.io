<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资源库</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        body {
            /* 修复背景图：使用绝对路径，确保在任何环境都能加载 */
            background-image: url('https://raw.githubusercontent.com/LootMaster141/11.github.io/main/files/bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: -1;
        }
        .login-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 400px;
            width: 90%;
            padding: 30px;
            background: rgba(34,34,34,0.7);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { margin-bottom: 20px; font-size: 22px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        input::placeholder { color: #ccc; }
        button {
            padding: 12px 25px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #0052cc; }

        .app-list {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 20px;
            display: none;
            overflow: hidden;
        }
        .pull-refresh {
            position: relative;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }
        .refresh-tip {
            position: sticky;
            top: 0;
            text-align: center;
            color: #ccc;
            padding: 8px 0;
            background: rgba(0,0,0,0.4);
            border-radius: 0 0 8px 8px;
            display: none;
            margin: 0 auto 10px;
            width: 50%;
        }
        .app-item {
            background: rgba(34,34,34,0.55);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform: translateZ(0);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .app-name { 
            font-size: 16px; 
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .download-btn {
            padding: 8px 14px;
            background: rgba(0,200,83,0.85);
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            text-shadow: 0 1px 1px rgba(0,0,0,0.5);
        }
        .download-btn:hover { background: rgba(0,178,72,0.95); }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="login-box" id="loginBox">
        <h2>请输入访问密码</h2>
        <input type="password" id="pwd" placeholder="输入密码">
        <button onclick="checkPwd()">确认登录</button>
    </div>

    <div class="app-list" id="appList">
        <div class="pull-refresh" id="pullRefresh">
            <div class="refresh-tip" id="refreshTip">刷新中...</div>
            <div id="appListContent"></div>
        </div>
    </div>

    <script>
        const RIGHT_PWD = "111";

        // 已移除“啊灵”的下载项
        const appList = [
            { name: "红魔Pad3Pro 机型模拟", path: "files/global_model_sim_redmagic_pad3pro.zip" },
            { name: "7436", path: "files/LSPosed-v1.9.2-it-7436-release.zip" },
            { name: "zy", path: "files/Zygisk-Next-1.3.1-665-7e5b533-release.zip" },
            { name: "淋羽", path: "files/林羽江颜过电报验证.sh" },
            { name: "核心破解", path: "files/核心破解_4.8.apk" },
            { name: "1+15", path: "files/全局机型模拟-一加15.zip" }
        ];

        const loginBox = document.getElementById("loginBox");
        const appListEl = document.getElementById("appList");
        const appListContent = document.getElementById("appListContent");
        const refreshTip = document.getElementById("refreshTip");
        let startY = 0;

        function checkPwd() {
            const inputPwd = document.getElementById("pwd").value.trim();
            if (inputPwd === RIGHT_PWD) {
                localStorage.clear();
                sessionStorage.clear();
                loginBox.style.display = "none";
                appListEl.style.display = "block";
                renderAppList();
            } else {
                alert("密码错误！请输入 111");
                document.getElementById("pwd").value = "";
            }
        }

        function renderAppList() {
            let listHtml = "";
            appList.forEach(item => {
                listHtml += `
                <div class="app-item">
                    <span class="app-name">${item.name}</span>
                    <a href="${item.path}" class="download-btn" download>下载</a>
                </div>
                `;
            });
            appListContent.innerHTML = listHtml;
        }

        document.getElementById("pullRefresh").addEventListener("touchstart", (e) => {
            startY = e.touches[0].clientY;
        }, { passive: true });

        document.getElementById("pullRefresh").addEventListener("touchend", (e) => {
            const endY = e.changedTouches[0].clientY;
            if (endY - startY > 60) {
                refreshTip.style.display = "block";
                setTimeout(() => {
                    renderAppList();
                    refreshTip.style.display = "none";
                }, 600);
            }
        }, { passive: true });

        refreshTip.addEventListener("click", () => {
            refreshTip.style.display = "block";
            setTimeout(() => {
                window.location.reload(true);
            }, 600);
        });
    </script>
</body>
</html>
