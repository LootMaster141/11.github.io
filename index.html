<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资源库</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: system-ui; color: #fff; background: #101015; }
        body { background: url('https://blackace.app/files/bg.png') center/cover fixed; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 0; }

        /* 登录框样式 */
        .login-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            width: 90%;
            max-width: 400px;
            padding: 32px;
            background: rgba(30,30,40,0.85);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .login-box h2 { margin-bottom: 24px; font-size: 22px; text-align: center; }
        #pwd {
            width: 100%;
            padding: 16px;
            margin-bottom: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        #pwd:focus { border-color: #0071FF; }
        #loginBtn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0071FF, #005ED0);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
        }

        /* 资源列表样式 */
        .app-list {
            display: none;
            padding: 20px;
            height: 100%;
            overflow-y: auto;
            z-index: 1;
            position: relative;
        }
        .app-item {
            background: rgba(40,40,50,0.7);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .download-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #00E470, #00C864);
            color: #fff;
            border-radius: 14px;
            text-decoration: none;
            font-size: 14px;
        }
        .download-btn.test { background: #666; pointer-events: none; }
    </style>
</head>
<body>
<div class="overlay"></div>

<!-- 登录界面 -->
<div class="login-box" id="loginBox">
    <h2>请输入密码</h2>
    <input type="password" id="pwd" placeholder="输入密码">
    <button id="loginBtn">确认登录</button>
</div>

<!-- 资源列表 -->
<div class="app-list" id="appList">
    <div id="listContent"></div>
</div>

<script>
    // 核心配置
    const RIGHT_PWD = "111";
    const loginBox = document.getElementById("loginBox");
    const appList = document.getElementById("appList");
    const listContent = document.getElementById("listContent");

    // 资源列表（已替换为可直接访问的真实URL）
    const resources = [
        { name: "红魔Pad3Pro 机型模拟", path: "https://blackace.app/files/%E5%85%A8%E5%B1%80%E6%9C%BA%E5%9E%8B%E6%A8%A1%E6%A8%8F-%E9%AD%94%E9%AD%94%20Pad%203%20Pro.zip" },
        { name: "7436", path: "https://blackace.app/files/LSPosed-v1.9.2-it-7436-release.zip" },
        { name: "zy", path: "https://blackace.app/files/Zygisk-Next-1.3.1-665-7e5b533-release.zip" },
        { name: "核心破解", path: "https://blackace.app/files/%E6%A0%B8%E5%BF%83%E7%A0%B4%E8%A7%A3_4.8.apk" },
        { name: "1+15", path: "https://blackace.app/files/%E5%85%A8%E5%B1%80%E6%9C%BA%E5%9E%8B%E6%A8%A1%E6%A8%8F-%E4%B%80%E5%8A%A0%2015.zip" }
    ];

    // 生成15个测试项
    for (let i = 1; i <= 15; i++) {
        resources.push({ name: `测试项 ${i}`, isTest: true });
    }

    // 登录验证
    document.getElementById("loginBtn").onclick = function() {
        const input = document.getElementById("pwd").value.trim();
        if (input === RIGHT_PWD) {
            loginBox.style.display = "none";
            appList.style.display = "block";
            renderList();
        } else {
            alert("密码错误！");
            document.getElementById("pwd").value = "";
        }
    };

    // 渲染列表（核心：强制调用系统浏览器下载）
    function renderList() {
        let html = "";
        resources.forEach(item => {
            if (item.isTest) {
                html += `
                <div class="app-item">
                    <span>${item.name}</span>
                    <span class="download-btn test">下载</span>
                </div>`;
            } else {
                // 关键修改：用click事件调用系统浏览器，绕过WebView限制
                html += `
                <div class="app-item">
                    <span>${item.name}</span>
                    <button class="download-btn" onclick="openBrowser('${item.path}')">下载</button>
                </div>`;
            }
        });
        listContent.innerHTML = html;
    }

    // 适配安卓打包工具：调用系统浏览器打开下载链接
    function openBrowser(url) {
        // 该打包工具会自动识别window.open并调用系统浏览器
        window.open(url, '_blank');
        // 提示用户跳转
        alert("已为你打开浏览器下载，请在浏览器中确认！");
    }
</script>
</body>
</html>
