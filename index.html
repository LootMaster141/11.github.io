<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资源库</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-image: url('files/bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: -1;
        }
        .login-box {
            max-width: 400px;
            margin: 100px auto 0;
            padding: 30px;
            background: rgba(34,34,34,0.9);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            text-align: center;
        }
        h2 { margin-bottom: 20px; font-size: 22px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #0052cc; }

        /* 下拉刷新容器 */
        .pull-refresh {
            position: relative;
            overflow: auto;
            max-height: 80vh;
            padding-top: 20px;
        }
        .refresh-tip {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ccc;
            padding: 10px 0;
            background: rgba(0,0,0,0.5);
            display: none;
        }

        /* 下载列表 */
        .app-list {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            display: none;
        }
        .app-item {
            background: rgba(34,34,34,0.9);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-name { font-size: 18px; font-weight: bold; }
        .download-btn {
            padding: 8px 16px;
            background: #00c853;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }
        .download-btn:hover { background: #00b248; }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="login-box" id="loginBox">
        <h2>请输入访问密码</h2>
        <input type="password" id="pwd" placeholder="输入密码">
        <br><br>
        <button onclick="checkPwd()">确认登录</button>
    </div>

    <div class="app-list" id="appList">
        <div class="pull-refresh" id="pullRefresh">
            <div class="refresh-tip" id="refreshTip">刷新中...</div>
            <div id="appListContent">
                <!-- 列表内容会自动填充 -->
            </div>
        </div>
    </div>

    <script>
        // 🔒 密码已修改为：111
        const RIGHT_PWD = "111";

        // 📦 软件列表配置（在这里添加你的文件）
        let appList = [
            {
                name: "红魔Pad3Pro 机型模拟",
                path: "files/global_model_sim_redmagic_pad3pro.zip"
            },
            {
                name: "7436", // 改成你的软件名
                path: "files/LSPosed-v1.9.2-it-7436-release（1）.zip" 
            },
            {
                name: "zy", // 改成你的软件名
                path: "files/Zygisk-Next-1.3.1-665-7e5b533-release（1）.zip" // 
            }，
             {
                name: "淋羽",
                path: "files/林羽江颜过电报验证.sh"
            },
             {
                name: "核心破解", // 改成你的软件名
                path: "files/核心破解_4.8.apk" 
            },
             {
                name: "啊灵", // 改成你的软件名
                path: "files/阿灵的设备标识重置（随机ID修改）.sh" 
            },
             {
                name: "1+15", // 改成你的软件名
                path: "files/全局机型模拟-一加 15.zip" 
            }
            // 要加更多软件，复制上面{}里的内容，逗号隔开即可
        ];

        // --- 以下代码无需修改 ---
        const loginBox = document.getElementById('loginBox');
        const appListEl = document.getElementById('appList');
        const appListContent = document.getElementById('appListContent');
        const refreshTip = document.getElementById('refreshTip');
        let startY = 0;

        // 登录验证
        function checkPwd() {
            const input = document.getElementById('pwd').value.trim();
            if (input === RIGHT_PWD) {
                localStorage.clear();
                loginBox.style.display = 'none';
                appListEl.style.display = 'block';
                renderAppList(); // 渲染列表
            } else {
                alert('密码错误，请重试！');
                document.getElementById('pwd').value = '';
            }
        }

        // 渲染软件列表
        function renderAppList() {
            let html = '';
            appList.forEach(app => {
                html += `
                <div class="app-item">
                    <span class="app-name">${app.name}</span>
                    <a href="${app.path}" class="download-btn" download>下载</a>
                </div>
                `;
            });
            appListContent.innerHTML = html;
        }

        // 下拉刷新逻辑
        document.getElementById('pullRefresh').addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        document.getElementById('pullRefresh').addEventListener('touchend', (e) => {
            const endY = e.changedTouches[0].clientY;
            // 判断是否为下拉动作
            if (endY - startY > 50) {
                refreshTip.style.display = 'block';
                // 模拟刷新（实际是重新加载列表和页面缓存）
                setTimeout(() => {
                    renderAppList();
                    window.location.reload(true); // 强制刷新页面
                    refreshTip.style.display = 'none';
                }, 1000);
            }
        });

        // PC端刷新支持（点击提示刷新）
        refreshTip.addEventListener('click', () => {
            refreshTip.style.display = 'block';
            setTimeout(() => {
                window.location.reload(true);
                refreshTip.style.display = 'none';
            }, 1000);
        });
    </script>
</body>
</html>
